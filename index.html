<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <title>weather</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.0.4/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="">

    <div id="app" class= "mt-20"></div>

    <form id="search-form" class="flex gap-2">
        <input
        type="search"
        id="city"
        placeholder="Enter city name..."
        class="border rounded p-2"
        >
        
        <button
        type="submit"
        class="bg-green-700 text-white px-4 py-2 rounded cursor-pointer"
        >
        Search
    </button>
</form>

<p id="error" class="text-red-500 hidden"></p>
<div id="results" class="mt-4 px-5 flex flex-col gap-2">
</div>
<script src="./js/main.js"></script>
</body>
</html>
